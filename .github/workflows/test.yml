name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile adult_filter.py
          python -m py_compile logos.py
          python -m py_compile config.py
          python -m py_compile order_m3u.py
          echo "All Python files have valid syntax"

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --tb=short --co -q || echo "No tests found yet"
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing || true

      - name: Check module imports
        run: |
          python -c "import adult_filter; print('adult_filter.py imports OK')"
          python -c "import logos; print(f'logos.py loaded {len(logos.LOGO_DB)} logos')"
          python -c "import config; print(f'config.py loaded {len(config.CHANNEL_ORDER)} order keywords')"
